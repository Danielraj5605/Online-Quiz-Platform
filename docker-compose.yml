services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quizzo
      POSTGRES_PASSWORD: quizzo
      POSTGRES_DB: quizzo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizzo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://quizzo:quizzo@postgres:5432/quizzo
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me-0123}
      NODE_ENV: production
      PORT: "5000"
      CORS_ORIGINS: http://localhost:8080
      TRUST_PROXY: "true"
    ports: ["5000:5000"]

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
